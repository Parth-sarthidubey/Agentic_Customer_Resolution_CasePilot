<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kestrel Home · Help Centre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2B2118; --ink-2: #6B5E53; --ink-3: #9A8B7D;
      --line: #E8DFD5; --bg: #FBF7F2; --card: #FFFFFF;
      --accent: #B4532A; --accent-2: #8E3F1F; --soft: #F4E9DE;
      --ok: #2F7D4F; --ok-bg: #E6F3EA; --warn: #9A6B12; --warn-bg: #FBF0DA;
      --shadow: 0 1px 2px rgba(43,33,24,.04), 0 8px 24px rgba(43,33,24,.06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }
    button, input, textarea, select { font: inherit; color: inherit; }

    header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
    .bar { max-width: 1140px; margin: 0 auto; padding: 13px 20px; display: flex; align-items: center; gap: 14px; }
    .brand { font-family: Fraunces, Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
    .brand span { color: var(--accent); }
    .spacer { flex: 1; }
    .who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
    .who select { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: #fff; }

    main { max-width: 1140px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 268px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 880px) { main { grid-template-columns: 1fr; padding: 14px; } .side { order: 2; } }

    .side { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
    .side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin: 4px 2px 10px; font-weight: 600; }
    .newbtn { width: 100%; border: 0; border-radius: 12px; padding: 11px 14px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .newbtn:hover { background: var(--accent-2); }
    .req { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 11px; padding: 10px 11px; margin-bottom: 3px; cursor: pointer; }
    .req:hover { background: var(--bg); }
    .req.on { background: #FFFCF8; border-color: #EBD8C9; }
    .req .t { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .req .rm { font-size: 11.5px; color: var(--ink-3); display: flex; gap: 7px; margin-top: 3px; align-items: center; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }
    .dot.live { background: var(--accent); animation: pulse 1.4s infinite; }
    .dot.done { background: var(--ok); }
    .dot.wait { background: var(--warn); }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

    .chat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 74vh; max-height: 84vh; overflow: hidden; }
    .chat-head { padding: 13px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .chat-head .ttl { font-weight: 600; font-size: 14.5px; }
    .chat-head .sub { font-size: 12.5px; color: var(--ink-3); }
    .badge { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--soft); color: var(--accent-2); }
    .badge.done { background: var(--ok-bg); color: var(--ok); }
    .badge.wait { background: var(--warn-bg); color: var(--warn); }

    .thread { flex: 1; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; }
    .m { max-width: 78%; padding: 10px 14px; border-radius: 16px; background: var(--soft); white-space: pre-wrap; word-wrap: break-word; }
    .m.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
    .m.them { align-self: flex-start; background: var(--soft); border-bottom-left-radius: 5px; }
    .m .n { font-size: 11px; opacity: .7; margin-bottom: 3px; font-weight: 600; letter-spacing: .02em; }
    .m .tm { font-size: 10.5px; opacity: .55; margin-top: 4px; }

    .chips { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 8px; max-width: 88%; margin: -2px 0 2px; }
    .chip { border: 1.5px solid #E0CDBD; background: #fff; color: var(--accent-2); border-radius: 999px; padding: 8px 15px; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: .12s; }
    .chip:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chip:disabled { opacity: .45; cursor: default; }
    .chips-hint { align-self: flex-start; font-size: 11.5px; color: var(--ink-3); margin-bottom: -4px; }

    .typing { align-self: flex-start; color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 9px; background: var(--bg); border-radius: 14px; padding: 9px 14px; }
    .tdots { display: inline-flex; gap: 3px; }
    .tdots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); display: block; animation: bounce 1.2s infinite; }
    .tdots i:nth-child(2) { animation-delay: .15s } .tdots i:nth-child(3) { animation-delay: .3s }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .45 } 30% { transform: translateY(-4px); opacity: 1 } }

    .welcome { margin: auto; text-align: center; max-width: 440px; padding: 20px; }
    .welcome h1 { font-family: Fraunces, Georgia, serif; font-size: 27px; font-weight: 500; margin: 0 0 8px; }
    .welcome p { color: var(--ink-2); margin: 0 0 20px; }
    .starters { display: flex; flex-direction: column; gap: 8px; }
    .starter { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 11px 15px; text-align: left; cursor: pointer; font-size: 14px; }
    .starter:hover { border-color: var(--accent); background: #FFFCF8; }

    .composer { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; gap: 9px; align-items: flex-end; background: var(--card); }
    .composer textarea { flex: 1; border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; resize: none; min-height: 46px; max-height: 140px; background: var(--bg); }
    .composer textarea:focus { outline: 2px solid rgba(180,83,42,.2); border-color: var(--accent); background: #fff; }
    .icon-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; width: 44px; height: 46px; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); flex: none; }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .send { border: 0; background: var(--accent); color: #fff; border-radius: 12px; width: 46px; height: 46px; cursor: pointer; display: grid; place-items: center; flex: none; }
    .send:hover { background: var(--accent-2); } .send:disabled { opacity: .4; cursor: default; }
    .files { padding: 0 16px 8px; font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; }
    .fchip { background: var(--soft); border-radius: 999px; padding: 3px 10px; }
    .thumbs { align-self: flex-end; display: flex; gap: 6px; flex-wrap: wrap; }
    .thumbs img { width: 74px; height: 74px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
    .formview { padding: 26px 24px; overflow-y: auto; }
    .formview h1 { font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 500; margin: 0 0 4px; }
    .formview .lede { color: var(--ink-2); margin: 0 0 20px; font-size: 14px; }
    .fld { margin-bottom: 15px; }
    .fld label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink-2); }
    .fld input, .fld textarea { width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; background: var(--bg); }
    .fld input:focus, .fld textarea:focus { outline: 2px solid rgba(180,83,42,.2); border-color: var(--accent); background: #fff; }
    .fld textarea { min-height: 120px; resize: vertical; }
    .drop { border: 1.5px dashed #D6C6B6; border-radius: 12px; padding: 15px; text-align: center; color: var(--ink-2); font-size: 13px; cursor: pointer; background: var(--bg); }
    .drop:hover, .drop.over { background: var(--soft); border-color: var(--accent); }
    .btn { border: 0; border-radius: 999px; padding: 11px 22px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--accent-2); }
    .altlink { width: 100%; border: 0; background: none; color: var(--ink-2); font-size: 12.5px; cursor: pointer; padding: 9px 4px 2px; text-decoration: underline; text-underline-offset: 2px; }
    .altlink:hover { color: var(--accent); }
    .closed { text-align: center; font-size: 13px; color: var(--ink-2); padding: 12px 16px; border-top: 1px solid var(--line); background: var(--bg); }
    footer { text-align: center; color: var(--ink-3); font-size: 12px; padding: 22px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <header><div class="bar">
    <div class="brand">Kestrel <span>Home</span></div>
    <div class="spacer"></div>
    <div class="who"><label for="me">Signed in as</label><select id="me"></select></div>
  </div></header>

  <main>
    <aside class="side">
      <button class="newbtn" id="new">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New request
      </button>
      <button class="altlink" id="newform">Or submit a request form</button>
      <h2 style="margin-top:14px">Your requests</h2>
      <div id="list"></div>
    </aside>

    <section class="chat">
      <div class="chat-head" id="head" hidden></div>
      <div class="thread" id="thread"></div>

      <!-- The non-conversational path. A form has nobody sitting at it, so the case goes
           straight to the agents exactly like an email does - no triage questions. -->
      <form class="formview" id="formview" hidden>
        <h1>Submit a request</h1>
        <p class="lede">We'll work on it and email you the outcome. Prefer to talk it through?
          <a href="#" id="tochat" style="color:var(--accent)">Start a chat instead</a>.</p>
        <div class="fld"><label for="f-sub">What's this about?</label>
          <input id="f-sub" name="subject" required placeholder="e.g. My lamp arrived broken"></div>
        <div class="fld"><label for="f-desc">Tell us more</label>
          <textarea id="f-desc" name="description" required placeholder="Your order number if you have it, what happened, and what you'd like us to do."></textarea></div>
        <div class="fld"><label>Photos or documents</label>
          <div class="drop" id="f-drop">Drag files here or <u>browse</u></div>
          <input type="file" id="f-file" multiple hidden accept="image/*,.pdf,.txt">
          <div class="files" id="f-files" style="padding:6px 0 0"></div></div>
        <button class="btn" type="submit">Send request</button>
      </form>
      <div class="files" id="files"></div>
      <div class="composer" id="composer">
        <button class="icon-btn" id="attach" title="Attach a photo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.4 11.05 12.25 20.2a5.5 5.5 0 0 1-7.78-7.78l9.2-9.2a3.67 3.67 0 1 1 5.18 5.18l-9.2 9.2a1.83 1.83 0 1 1-2.6-2.6l8.5-8.48"/></svg></button>
        <input type="file" id="file" multiple hidden accept="image/*,.pdf,.txt">
        <label for="msg" class="sr">Message</label>
        <textarea id="msg" placeholder="Describe what happened — we'll take it from there…" rows="1"></textarea>
        <button class="send" id="send" title="Send"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      </div>
      <div class="closed" id="closed" hidden></div>
    </section>
  </main>
  <footer>Kestrel Home is a fictional retailer used to demonstrate CasePilot. All data is synthetic.</footer>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let me = null, open = null, files = [], busy = false, lastRender = "", formMode = false, formFiles = [];

const FRIENDLY = {
  "Resolved": ["Resolved", "done"], "Waiting on Customer": ["Needs your reply", "wait"],
  "Escalated": ["With a specialist", "wait"], "Routed": ["With a specialist", "wait"],
  "Awaiting Approval": ["Being reviewed", "wait"],
};
const STARTERS = [
  "My order arrived damaged",
  "Where is my order?",
  "I'd like to return something",
  "I was charged the wrong amount",
];

async function api(p, o = {}) {
  const r = await fetch(p, o);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ---------- boot ---------- */
(async () => {
  const cs = await api("/api/customers");
  $("#me").innerHTML = cs.map((c) => `<option value="${esc(c.email)}|${esc(c.name)}">${esc(c.name)}</option>`).join("");
  $("#me").onchange = () => { me = $("#me").value.split("|"); open = null; lastRender = ""; render(); };
  me = $("#me").value.split("|");
  render();
  setInterval(() => { if (!busy) render(); }, 1500);
})();

/* ---------- composer ---------- */
const msg = $("#msg");
msg.addEventListener("input", () => { msg.style.height = "auto"; msg.style.height = Math.min(msg.scrollHeight, 140) + "px"; });
msg.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("#send").onclick = () => send();
$("#new").onclick = () => { formMode = false; open = null; lastRender = ""; files = []; showFiles(); render(); msg.focus(); };
$("#newform").onclick = () => { formMode = true; open = null; lastRender = ""; render(); };
$("#tochat").onclick = (e) => { e.preventDefault(); formMode = false; lastRender = ""; render(); msg.focus(); };
$("#attach").onclick = () => $("#file").click();
$("#file").onchange = (e) => { files = [...files, ...e.target.files]; showFiles(); e.target.value = ""; };
function showFiles() {
  $("#files").innerHTML = files.map((f, i) => `<span class="fchip">📎 ${esc(f.name)} <button data-i="${i}" style="border:0;background:none;cursor:pointer;color:inherit">×</button></span>`).join("");
  document.querySelectorAll("#files button").forEach((b) => (b.onclick = () => { files.splice(+b.dataset.i, 1); showFiles(); }));
}

/* The form path files on the `portal` channel, which the orchestrator runs straight through -
   there is nobody sitting at a form to answer a clarifying question. */
const fdrop = $("#f-drop"), fpick = $("#f-file");
fdrop.onclick = () => fpick.click();
fdrop.ondragover = (e) => { e.preventDefault(); fdrop.classList.add("over"); };
fdrop.ondragleave = () => fdrop.classList.remove("over");
fdrop.ondrop = (e) => { e.preventDefault(); fdrop.classList.remove("over"); formFiles = [...formFiles, ...e.dataTransfer.files]; showFormFiles(); };
fpick.onchange = (e) => { formFiles = [...formFiles, ...e.target.files]; showFormFiles(); e.target.value = ""; };
function showFormFiles() {
  $("#f-files").innerHTML = formFiles.map((f) => `<span class="fchip">&#128206; ${esc(f.name)}</span>`).join("");
}
$("#formview").onsubmit = async (e) => {
  e.preventDefault();
  if (busy) return;
  busy = true;
  try {
    const fd = new FormData();
    fd.append("subject", $("#f-sub").value); fd.append("description", $("#f-desc").value);
    fd.append("customer_email", me[0]); fd.append("customer_name", me[1]); fd.append("channel", "portal");
    formFiles.forEach((f) => fd.append("files", f));
    const c = await api("/api/cases", { method: "POST", body: fd });
    $("#f-sub").value = ""; $("#f-desc").value = ""; formFiles = []; showFormFiles();
    formMode = false; open = c.id;
  } catch (err) {
    alert("Could not send: " + err.message);
  } finally {
    busy = false; lastRender = ""; render();
  }
};

async function send(text) {
  const body = (text ?? msg.value).trim();
  if ((!body && !files.length) || busy) return;
  busy = true; $("#send").disabled = true;
  try {
    const fd = new FormData();
    files.forEach((f) => fd.append("files", f));
    if (open) {
      fd.append("body", body); fd.append("sender", "customer");
      await api(`/api/cases/${open}/messages`, { method: "POST", body: fd });
    } else {
      fd.append("message", body); fd.append("customer_email", me[0]); fd.append("customer_name", me[1]);
      const c = await api("/api/chat", { method: "POST", body: fd });
      open = c.id;
    }
    msg.value = ""; msg.style.height = "auto"; files = []; showFiles();
  } catch (err) {
    alert("Could not send: " + err.message);
  } finally {
    busy = false; $("#send").disabled = false; lastRender = ""; render();
  }
}

/* ---------- render ---------- */
async function render() {
  const all = await api("/api/cases").catch(() => null);
  if (!all) return;
  const mine = all.filter((c) => c.customer_email === me[0]);

  $("#list").innerHTML = mine.map((c) => {
    const [label, cls] = FRIENDLY[c.status] || ["In progress", ""];
    return `<button class="req ${c.id === open ? "on" : ""}" data-id="${c.id}">
      <div class="t">${esc(c.subject)}</div>
      <div class="rm"><span class="dot ${c.running ? "live" : cls}"></span>${esc(c.number)} · ${esc(c.running ? "Working…" : label)}</div>
    </button>`;
  }).join("") || `<div style="color:var(--ink-3);font-size:13px;padding:6px 2px">No requests yet.</div>`;
  document.querySelectorAll(".req").forEach((b) => (b.onclick = () => { open = +b.dataset.id; lastRender = ""; render(); }));

  $("#formview").hidden = !formMode;
  $("#thread").hidden = formMode;
  $("#composer").hidden = formMode;
  if (formMode) { $("#head").hidden = true; $("#closed").hidden = true; $("#files").hidden = true; return; }
  $("#files").hidden = false;

  if (!open) return renderWelcome();

  const [d, events] = await Promise.all([
    api(`/api/cases/${open}?customer_view=true`),
    api(`/api/cases/${open}/events`).catch(() => []),
  ]);
  const stages = events.filter((e) => e.type === "stage");
  const live = d.running ? friendlyStage(stages.length ? stages[stages.length - 1].payload.text : "") : "";

  // Only the newest agent question is answerable; older chips are history.
  const last = d.messages[d.messages.length - 1];
  const chips = (last && last.sender === "agent" && d.case.status === "Waiting on Customer"
                 && (last.meta || {}).choices) || [];

  const html = d.messages.map((m) => {
    const isMine = m.sender === "customer";
    return `<div class="m ${isMine ? "me" : "them"}">
      <div class="n">${isMine ? "You" : "Kestrel Support"}</div>${esc(m.body)}
      <div class="tm">${when(m.created_at)}</div></div>`;
  }).join("")
    + (d.attachments.length ? `<div class="thumbs">${d.attachments.map((a) => a.content_type.startsWith("image/")
        ? `<img src="/api/attachments/${a.id}" alt="${esc(a.filename)}" title="${esc(a.filename)}">`
        : `<span class="fchip">📎 ${esc(a.filename)}</span>`).join("")}</div>` : "")
    + (chips.length ? `<div class="chips-hint">Tap one, or type your own answer</div><div class="chips">${
        chips.map((c) => `<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : "")
    + (live ? `<div class="typing"><span class="tdots"><i></i><i></i><i></i></span>${esc(live)}</div>` : "");

  const th = $("#thread");
  const atBottom = th.scrollHeight - th.scrollTop - th.clientHeight < 60;
  if (html !== lastRender) {
    th.innerHTML = html;
    lastRender = html;
    document.querySelectorAll(".chip").forEach((b) => (b.onclick = () => {
      document.querySelectorAll(".chip").forEach((x) => (x.disabled = true));
      send(b.dataset.c);
    }));
    if (atBottom) th.scrollTop = th.scrollHeight;
  }

  const [label, cls] = FRIENDLY[d.case.status] || ["In progress", ""];
  $("#head").hidden = false;
  $("#head").innerHTML = `<div><div class="ttl">${esc(d.case.subject)}</div>
    <div class="sub">${esc(d.case.number)}</div></div><div style="flex:1"></div>
    <span class="badge ${cls}">${esc(d.running ? "Working on it" : label)}</span>`;

  const done = d.case.status === "Resolved";
  $("#closed").hidden = !done;
  if (done) $("#closed").textContent = "This request is resolved. Send a message below if you need anything else.";
  msg.placeholder = d.case.status === "Waiting on Customer"
    ? "Type your answer…" : "Add anything else we should know…";
}

function renderWelcome() {
  $("#head").hidden = true;
  $("#closed").hidden = true;
  msg.placeholder = "Describe what happened — we'll take it from there…";
  const html = `<div class="welcome">
    <h1>How can we help?</h1>
    <p>Tell us what happened and our support assistant will look into your orders straight away. Attach a photo if something arrived damaged.</p>
    <div class="starters">${STARTERS.map((s) => `<button class="starter" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
  </div>`;
  if (html !== lastRender) {
    $("#thread").innerHTML = html;
    lastRender = html;
    document.querySelectorAll(".starter").forEach((b) => (b.onclick = () => { msg.value = b.dataset.s; msg.focus(); }));
  }
}

function when(iso) {
  if (!iso) return "";
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  return d.toLocaleString([], { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" });
}

function friendlyStage(text) {
  if (!text) return "Looking into your request…";
  const t = text.toLowerCase();
  if (t.includes("intake") || t.includes("reading")) return "Reading your message…";
  if (t.includes("clarifying")) return "One moment…";
  if (t.includes("investigator") || t.includes("checking")) return "Checking your order and delivery…";
  if (t.includes("planning") || t.includes("resolver") || t.includes("re-planning")) return "Working out the best option for you…";
  if (t.includes("policy")) return "Checking this against our policy…";
  if (t.includes("executing")) return "Putting it through…";
  if (t.includes("adapting")) return "That didn't work — trying another way…";
  if (t.includes("verifying") || t.includes("verifier")) return "Confirming it went through…";
  if (t.includes("communicator") || t.includes("writing")) return "Writing back to you…";
  if (t.includes("approval")) return "A colleague is reviewing this…";
  if (t.includes("escalat") || t.includes("routed")) return "Passing you to a specialist…";
  return "Working on it…";
}
</script>
